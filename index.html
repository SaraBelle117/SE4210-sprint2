<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TODO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Buffer Overflow Visualization</h1>

    <div class="inputRow">
        <label for="inputString">Enter a string:</label>
        <input type="text" id="inputString">
        <button id="submitBtn" class="submitBtn">Submit</button>
    </div>

    <div class="bufferSizeRow">
        <span>Buffer size:</span>
        <button id="decreaseBtn" class="sizeBtn">-</button>
        <span id="bufferSizeValue"></span>
        <button id="increaseBtn" class="sizeBtn">+</button>
    </div>

    <div id="arrayDisplay"></div>
    <div id="stackDisplay"></div>

    <script src="script.js"></script>
</body>
</html>
